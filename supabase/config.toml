project_id = "fruit-punchy-kopi-and-art"

[auth]
site_url = "https://fruit-punchy-kopi-co.vercel.app"
additional_redirect_urls = [
  "https://fruit-punchy-kopi-co.vercel.app/?account=callback",
  "https://fruit-punchy-kopi-co.vercel.app/?account=set-password",
  "https://fruit-punchy-kopi-co.vercel.app/?account=reset",
  "https://fruit-punchy-kopi-co-nbkoh.vercel.app/",
  "https://fruit-punchy-kopi-co-nbkoh.vercel.app/**",
  "https://fruit-*-punchy-kopi-co-nbkoh.vercel.app",
  "https://fruit-*-punchy-kopi-co-nbkoh.vercel.app/**"
]
minimum_password_length = 12

[auth.email]
enable_confirmations = false

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "naiboon1963@gmail.com"
pass = "env(GMAIL_SMTP_PASSWORD)"
admin_email = "naiboon1963@gmail.com"
sender_name = "Fruit Punchy Kopi and Art"

[functions.invite-staff]
# The handler authorizes invitations using the server-only staff-code hash.
# An owner session is not required. All database work remains server-side.
verify_jwt = false

[functions.member-auth]
# Public entry point; validates passwords and approval on the server.
verify_jwt = false

[functions.admin-members]
# Uses its own server-verified, short-lived admin session.
verify_jwt = false
